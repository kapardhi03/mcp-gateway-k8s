# Production k3s VPS overrides. See D-002, D-020, D-022.
#
# homeUrl is the only store difference from values-local.yaml, and it is the
# subtlest value in the whole project. It is NOT where woo-mcp connects; that
# is store.serviceUrl, the in-cluster Service. homeUrl is what WooCommerce
# expects to have been SIGNED, and it is derived from WooCommerce's own
# verifier rather than guessed:
#
#   check_oauth_signature() builds the base string with
#     rawurlencode( get_home_url( null, $request_path, is_ssl() ? 'https' : 'http' ) )
#
# So the HOST comes from the stored home URL, which is now the DuckDNS name,
# while the SCHEME comes from is_ssl(), which is evaluated per request. woo-mcp
# calls the Service over plain HTTP inside the cluster and sends no
# X-Forwarded-Proto, so is_ssl() is false and WooCommerce signs with "http"
# even though the site's home URL is https.
#
# Hence: new host, old scheme. Changing this to https breaks every call with a
# 401 that looks like a credential problem and is not. VDOD-7 proves it both
# ways: the http form must return 200 and the https form must return 401.
store:
  homeUrl: http://store.kapardhi-gw.duckdns.org

imagePullSecrets:
  - name: ghcr
