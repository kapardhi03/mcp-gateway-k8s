# ClusterIP on purpose. There is no Ingress for this chart and there must not
# be one: the Woo MCP server is reachable only from inside the cluster, and
# only from the gateway. See W-08 and the NetworkPolicy.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "woo-mcp.fullname" . }}
  labels:
    {{- include "woo-mcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "woo-mcp.selectorLabels" . | nindent 4 }}
