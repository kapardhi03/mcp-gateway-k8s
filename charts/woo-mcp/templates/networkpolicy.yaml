{{- if .Values.networkPolicy.enabled }}
# Deny by default, then allow exactly one source.
#
# Selecting this pod with an empty ingress list would deny everything. Here we
# allow ingress ONLY from pods carrying the gateway label, so the storefront,
# the database and any other pod in the namespace cannot reach woo-mcp even
# though they share a network. An unlabelled pod gets no reply at all, so it
# TIMES OUT rather than being refused, which is what WM-6 asserts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "woo-mcp.fullname" . }}
  labels:
    {{- include "woo-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "woo-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.allowFromPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
