apiVersion: v1
kind: Service
metadata:
  name: {{ include "store.wp.fullname" . }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.wordpress.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "store.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: wordpress
