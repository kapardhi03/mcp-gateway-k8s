# Defaults for the fx-mcp chart.
#
# This service has NO credentials. Frankfurter serves ECB rates with no API
# key, verified by calling it (D-010). That is deliberate: woo-mcp exercises
# the gateway's credential path and fx-mcp exercises the no-auth path, so the
# gateway has to handle both.
#
# No ingress section, same as woo-mcp: cluster-internal only, reachable only
# from the gateway via the NetworkPolicy.

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: ghcr.io/kapardhi03/fx-mcp
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  port: 8000

fx:
  # Upstream rates API. Keyless.
  apiBase: https://api.frankfurter.dev/v1
  timeoutSeconds: 10

networkPolicy:
  enabled: true
  allowFromPodLabels:
    app.kubernetes.io/name: gateway
  # This service, unlike woo-mcp, must reach the public internet for rates.
  # Egress is therefore left unrestricted here and the policy covers Ingress
  # only. Locking egress down to the rates API is a stretch-goal item.

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 192Mi

probes:
  # TCP only, and deliberately not a call to the rates API: if Frankfurter is
  # down this pod is still healthy and must stay Ready so it can return a
  # clear tool error rather than being restarted.
  readiness:
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
