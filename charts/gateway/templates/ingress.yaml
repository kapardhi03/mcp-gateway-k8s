{{- if .Values.ingress.enabled }}
# The gateway is the ONE component clients reach from outside (K-06).
# woo-mcp and fx-mcp deliberately have no Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required "ingress.className must be set per environment" .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  # TLS is values-only. The host, the Secret name and the issuer annotation
  # all come from values-prod.yaml, so this chart still renders without TLS
  # on a reviewer's cluster and nothing cluster-specific is hardcoded here.
  # The issuer is named by an annotation, not here: see values-prod.yaml.
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tls.secretName is required when ingress.tls.enabled" .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host must be set per environment" .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "gateway.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
