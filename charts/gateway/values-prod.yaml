# Production k3s VPS overrides. See D-022.
ingress:
  className: traefik
  host: gateway.kapardhi-gw.duckdns.org
  annotations:
    # STAGING first, then letsencrypt-prod. See VDOD-3 and VDOD-4.
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: gateway-tls

gateway:
  # TLS ends at the ingress controller, so the pod is reached over plain
  # HTTP. Without this the Secure cookie flag can never turn on. VDOD-8.
  forwardedAllowIps: "*"

postgres:
  storage:
    className: local-path

imagePullSecrets:
  - name: ghcr

# Pinned, multi-arch (linux/amd64 + linux/arm64), private on GHCR.
# Dashboard, chat agent and FORWARDED_ALLOW_IPS. Pushed 2026-10-22.
image:
  tag: "0.4.5"
