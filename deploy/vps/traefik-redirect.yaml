# Redirect every plain HTTP request to HTTPS, cluster-wide. See VDOD-5.
#
# k3s manages its bundled Traefik with a HelmChart resource, and a
# HelmChartConfig in kube-system merges extra values into it. This is a
# cluster-level concern, not an application one, which is why it is here and
# not in charts/: the apps stay portable and a reviewer's cluster decides its
# own redirect policy.
#
# This does NOT break the ACME HTTP-01 challenge. Let's Encrypt's validator
# "follows redirects, up to 10 redirects deep", accepts redirects to http or
# https on ports 80 and 443, and "when redirected to an HTTPS URL, it does
# not validate certificates", precisely so a challenge can bootstrap the
# first certificate. Verified before writing this, not assumed.
# Source: https://letsencrypt.org/docs/challenge-types/
#
# Verified applied on 2026-10-22. If you change this, check the key path
# against the chart this k3s ships, not upstream docs:
#   kubectl -n kube-system get helmchart traefik -o yaml
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        # NOTE the `http:` level. The key is ports.web.http.redirections,
        # not ports.web.redirections. The first attempt omitted it and the
        # value was silently ignored: helm reported the upgrade as deployed
        # at revision 2, the Deployment did not change, and the Traefik pod
        # never restarted. Nothing anywhere said the key was unknown.
        # Confirmed against the chart this k3s actually ships
        # (traefik-39.0.701+up39.0.7), values.yaml line 861 and
        # templates/_podtemplate.tpl, rather than against upstream docs.
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
